<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Granja - 4 estilos organicos (previsualizacion)</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d0d0f;color:#eee;margin:0 auto;padding:1.2rem;max-width:1100px}
h1{font-size:1.3rem;margin:.2rem 0}p{margin:.3rem 0;color:#aaa;font-size:.9rem}
figure{margin:0 0 1.6rem}canvas{width:100%;display:block;border:2px solid #444;border-radius:6px;background:#000}
figcaption{margin-top:.4rem;font-size:.92rem;line-height:1.4}b{color:#b6ff3b}
</style></head><body>
<h1>Granja - 4 estilos con formas org&aacute;nicas (previsualizaci&oacute;n)</h1>
<p>Mismo guion de 8 s en los cuatro, con la moto rehecha como silueta curva. Espacio = pausa &middot; L = c&aacute;mara lenta &middot; <code>?t=0.56</code> congela un instante.</p>

<figure><canvas id="c1" width="960" height="540"></canvas>
<figcaption><b>2. Cartoon cel-shaded</b> - contorno grueso, sombra dura recortada a la forma, mundo p&uacute;rpura &aacute;cido, explosi&oacute;n en estrella.</figcaption></figure>
<figure><canvas id="c2" width="960" height="540"></canvas>
<figcaption><b>3. Low-poly</b> - cada forma es un pol&iacute;gono de pocos v&eacute;rtices con facetas que parten del centro; sombras suaves, bloom y niebla.</figcaption></figure>
<figure><canvas id="c3" width="960" height="540"></canvas>
<figcaption><b>A. C&oacute;mic de tinta</b> - contorno que tiembla a ~9 dibujos por segundo, plano de color desalineado y sombreado con puntos de halftone.</figcaption></figure>
<figure><canvas id="c4" width="960" height="540"></canvas>
<figcaption><b>B. Vinilo inflado</b> - formas redondeadas con degradado radial, brillo especular, luz de rebote y sombras de contacto suaves.</figcaption></figure>

<script>
const DUR=8000,PER=1280,TAU=Math.PI*2;
const q=new URLSearchParams(location.search),fixedT=q.has('t')?+q.get('t'):null;
let paused=false,slow=false,clock=0,last=null;
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault()}if(e.key==='l'||e.key==='L')slow=!slow});
const C01=v=>v<0?0:v>1?1:v,seg=(t,a,b)=>C01((t-a)/(b-a)),ease=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,wrap=t=>((t%1)+1)%1,lerp=(a,b,t)=>a+(b-a)*t;
const back=t=>1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2);
const motoY=t=>{t=wrap(t);return 200-24*(eio(seg(t,.34,.5))-eio(seg(t,.52,.66)))};
const CROW=[{y:96,tx:300,k:1},{y:300,tx:330,k:1},{y:120,tx:380,k:0},{y:330,tx:350,k:0},{y:164,tx:430,k:0},{y:250,tx:410,k:0}];
function sim(t){
  const scroll=t*PER,sx=wx=>((wx-scroll+200)%PER+PER)%PER-200;
  const mx=210,my=motoY(t),ty=motoY(t-.05);
  const ang=Math.atan2((motoY(t+.01)-motoY(t-.01))*2.2,50);
  const trailer={x:mx-92,y:ty,ang:Math.atan2(my-ty,62)*1.4};
  const nitro=ease(seg(t,.16,.2))*(1-seg(t,.34,.4));
  const boom=t>=.5?seg(t,.5,.7):-1,kills=36+(t>=.5?1:0)+(t>=.6?2:0);
  let fuel;if(t<.5)fuel=.62-.16*(t/.5);else if(t<.6)fuel=lerp(.46,.70,ease(seg(t,.5,.6)));else fuel=.70-.08*(t-.6)/.4;
  const crows=CROW.map((c,i)=>{
    const sx0=740+i*26,sy0=c.y,ex=c.tx,ey=c.y+(i%2?-18:18);
    const a=ease(seg(t,.04+.012*i,.34+.01*i)),d=eio(seg(t,.36,.6));
    const dx=c.k?mx+34:c.tx-40,dy=c.k?motoY(.6):(c.y<200?my-50:my+50);
    let x=lerp(lerp(sx0,ex,a),dx,d),y=lerp(lerp(sy0,ey,a),dy,d);
    y+=Math.sin(TAU*(t*3+i/6))*7*(1-d);
    let alpha=1,rot=0,dead=false;
    if(c.k&&t>=.6){const f=seg(t,.6,.8);dead=true;x=dx-f*60-(t-.6)*PER;y=dy+f*50*(i?-1:1);alpha=1-f;rot=f*7}
    else if(!c.k){const f=ease(seg(t,.66,.95));x=lerp(x,sx0,f);y=lerp(y,sy0,f)}
    return{x,y,alpha,rot,dead,flap:TAU*(t*24+i*.17),big:i===4?1.4:1}
  });
  const cam=t>=.5?(1-seg(t,.5,.62)):0;
  return{t,scroll,sx,mx,my,ang,trailer,nitro,boom,kills,fuel,crows,cam,
    shx:Math.sin(t*900)*6*cam,shy:Math.cos(t*1100)*4*cam,
    squash:t>=.5?(1-seg(t,.5,.6)):0,
    pop:1+.4*Math.sin(Math.PI*seg(t,.5,.58))+.4*Math.sin(Math.PI*seg(t,.6,.68)),
    barrel:{x:sx(884),y:176,alive:t<.5},cart:{x:sx(1200),y:236},silo:{x:sx(1000),y:90},
    dust:i=>{const u=(t*3+i/6)%1;return{x:mx-34-u*54,y:my+Math.sin(TAU*(t*5+i*.3))*4,a:1-u,r:3+u*7}}};
}

/* ---------- geometria y utilidades ---------- */
const SC=1.25,COS=.8660254,SIN=.5,OX=330,OY=290,SLAB=22,INK='#2b1d2e';
const prj=(u,v,z)=>[OX+(u-v)*COS*SC,OY+(u+v)*SIN*SC-z*SC];
const h2=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const toH=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mulH=(h,f)=>toH(h2(h).map(v=>v*f)),mixH=(a,b,t)=>{const A=h2(a),B=h2(b);return toH(A.map((v,i)=>v+(B[i]-v)*t))};
const wrapU=(i,sp,scroll)=>((i*sp-scroll+480)%PER+PER)%PER-480;
const hs=(a,b,c)=>{const x=Math.sin(a*12.9898+b*78.233+c*37.719)*43758.5453;return x-Math.floor(x)};
const circ=(cx,cy,r,n=10)=>Array.from({length:n},(_,i)=>[cx+Math.cos(i/n*TAU)*r,cy+Math.sin(i/n*TAU)*r]);
const ell=(cx,cy,rx,ry,n=10)=>Array.from({length:n},(_,i)=>[cx+Math.cos(i/n*TAU)*rx,cy+Math.sin(i/n*TAU)*ry]);
const mv=(P,dx,dy)=>P.map(p=>[p[0]+dx,p[1]+dy]);
const bbox=P=>{let a=1e9,b=1e9,d=-1e9,e=-1e9;for(const p of P){a=Math.min(a,p[0]);b=Math.min(b,p[1]);d=Math.max(d,p[0]);e=Math.max(e,p[1])}return[a,b,d-a,e-b]};
function trace(c,P,smooth){const n=P.length;c.beginPath();c.moveTo(P[0][0],P[0][1]);
  if(!smooth){for(let i=1;i<n;i++)c.lineTo(P[i][0],P[i][1])}
  else for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    c.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1])}
  c.closePath()}

const PALS={
cel:{field:'#6a3fb5',tA:'#9be04a',tB:'#4e2a8a',wall:'#c4308a',road:'#ffb347',edge:'#e8782a',dash:'#fff3d6',bA:'#ff3b5c',bB:'#21d6b0',moto:'#21d6b0',tank:'#ff7a1a',tire:'#1b0f2e',hub:'#fff3d6',metal:'#9aa0b8',suit:'#ff7a1a',helmet:'#ffcf33',visor:'#8fe9ff',wood:'#c98a3c',trailer:'#ffcf33',crate:'#ff3b5c',barrel:'#ff7a1a',acc:'#b6ff3b',silo:'#f5e9ff',silo2:'#c4308a',crow:'#2b1b4a',wing:'#3d2866',beak:'#ffb02e',flame:'#ffb02e',flame2:'#fff3d6',rock:'#8a6bd0',tree:'#3b2a5a'},
low:{field:'#5fa88c',tA:'#9ed9a8',tB:'#3f8a74',wall:'#c98a6a',road:'#e6c9a0',edge:'#cfae82',dash:'#fbf2e0',bA:'#ff6b5e',bB:'#3ec9b7',moto:'#4a6fa5',tank:'#ff8f4a',tire:'#2a2d3a',hub:'#d8dce6',metal:'#aab0c0',suit:'#ff8f4a',helmet:'#f6e27a',visor:'#a8e8ff',wood:'#c9925a',trailer:'#d8a05a',crate:'#ff6b5e',barrel:'#ff8f4a',acc:'#c8ff5a',silo:'#e8e2d4',silo2:'#c98a6a',crow:'#5a4a86',wing:'#46386e',beak:'#ffb84a',flame:'#c8ff5a',flame2:'#fffbd0',rock:'#8fb3a8',tree:'#4a5a58'},
ink:{field:'#c9b25a',tA:'#8a9a3a',tB:'#6a7a2a',wall:'#b3523a',road:'#f0e0b8',edge:'#d4b078',dash:'#fffaf0',bA:'#e0463a',bB:'#2a8f7a',moto:'#2f6f8f',tank:'#e86a2a',tire:'#2b1d2e',hub:'#f0e8d8',metal:'#9a9aa0',suit:'#e8552a',helmet:'#f2c230',visor:'#9ad6e6',wood:'#b07a3c',trailer:'#d9a441',crate:'#e0463a',barrel:'#e86a2a',acc:'#9ad63a',silo:'#efe6d0',silo2:'#b3523a',crow:'#3a2a4a',wing:'#2f2040',beak:'#f2a030',flame:'#f2a030',flame2:'#fff4d0',rock:'#a89a7a',tree:'#4a3a2a'},
vin:{field:'#7fc4a6',tA:'#b8e8c8',tB:'#5aa88c',wall:'#e0a080',road:'#f3d9b0',edge:'#e2c090',dash:'#ffffff',bA:'#ff7a8a',bB:'#5fd4c4',moto:'#ff7a59',tank:'#ffd23a',tire:'#3a3550',hub:'#f5f2ff',metal:'#c8c4dc',suit:'#7a6af0',helmet:'#ffd23a',visor:'#bfe9ff',wood:'#e0a070',trailer:'#f2b866',crate:'#ff7a8a',barrel:'#7a6af0',acc:'#d4ff6a',silo:'#fff3e6',silo2:'#ff7a8a',crow:'#6a5a9a',wing:'#524480',beak:'#ffb84a',flame:'#d4ff6a',flame2:'#ffffff',rock:'#b8c4d4',tree:'#8a6a5a'}};

/* ---------- fabrica de estilos ---------- */
function makeStyle(kind,c){
  const pal=PALS[kind],S={c,pal,kind,sc:1,sid:0,frame:0};
  S.shape=(P,m)=>{const b=pal[m],sc=S.sc;
    if(kind==='cel'){trace(c,P,true);c.fillStyle=mulH(b,.6);c.fill();c.save();c.clip();c.translate(-3.5,-4.5);trace(c,P,true);c.fillStyle=b;c.fill();c.restore();
      trace(c,P,true);c.lineWidth=3.2/sc;c.strokeStyle='#1b0f2e';c.lineJoin='round';c.stroke()}
    else if(kind==='low'){const n=P.length;let cx=0,cy=0;for(const p of P){cx+=p[0];cy+=p[1]}cx/=n;cy/=n;
      for(let i=0;i<n;i++){const a=P[i],d=P[(i+1)%n],ang=Math.atan2((a[1]+d[1])/2-cy,(a[0]+d[0])/2-cx),col=mulH(b,.74+.34*Math.cos(ang+2.4));
        c.beginPath();c.moveTo(cx,cy);c.lineTo(a[0],a[1]);c.lineTo(d[0],d[1]);c.closePath();c.fillStyle=col;c.fill();c.lineWidth=.7/sc;c.strokeStyle=col;c.stroke()}}
    else if(kind==='ink'){const id=S.sid++,fr=S.frame,[x0,y0,w,h]=bbox(P),amp=1.6/sc;
      const J=k=>P.map((p,i)=>[p[0]+(hs(i,id+k,fr)-.5)*2*amp,p[1]+(hs(i+50,id+k,fr)-.5)*2*amp]);
      trace(c,mv(P,2.4/sc,2.4/sc),true);c.fillStyle=b;c.fill();
      if(w*h*sc*sc>420){c.save();trace(c,P,true);c.clip();const st=4.2/sc,dk=mulH(b,.5);c.fillStyle=dk;c.beginPath();
        for(let gx=x0;gx<x0+w;gx+=st)for(let gy=y0;gy<y0+h;gy+=st){const t=((gx-x0)/w+(gy-y0)/h)*.5,r=Math.max(0,t-.42)*3.4/sc;if(r>.25){c.moveTo(gx+r,gy);c.arc(gx,gy,r,0,TAU)}}c.fill();c.restore()}
      c.lineJoin='round';c.lineCap='round';c.strokeStyle=INK;
      c.globalAlpha=.92;c.lineWidth=2.4/sc;trace(c,J(0),true);c.stroke();c.globalAlpha=.45;c.lineWidth=1.1/sc;trace(c,J(7),true);c.stroke();c.globalAlpha=1}
    else{const[x0,y0,w,h]=bbox(P);trace(c,P,true);const g=c.createRadialGradient(x0+w*.32,y0+h*.28,0,x0+w*.5,y0+h*.5,Math.max(w,h)*.78);
      g.addColorStop(0,mixH(b,'#ffffff',.5));g.addColorStop(.45,b);g.addColorStop(1,mulH(b,.58));c.fillStyle=g;c.fill();
      c.save();c.clip();c.translate(-2.5,-3);trace(c,P,true);c.lineWidth=7/sc;c.strokeStyle=mixH(b,'#ffe6c8',.5);c.globalAlpha=.3;c.stroke();c.restore();c.globalAlpha=1;
      if(w*sc>14){c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(x0+w*.3,y0+h*.24,w*.14,h*.08,-.5,0,TAU);c.fill()}}};
  S.flat=(P,col,ol)=>{c.beginPath();P.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
    if(kind==='low'||kind==='vin'){let a=1e9,d=-1e9;for(const p of P){a=Math.min(a,p[1]);d=Math.max(d,p[1])}const g=c.createLinearGradient(0,a,0,d+1);g.addColorStop(0,mixH(col,'#ffffff',kind==='low'?.14:.2));g.addColorStop(1,mulH(col,kind==='low'?.84:.88));c.fillStyle=g}else c.fillStyle=col;
    c.fill();if(ol&&(kind==='cel'||kind==='ink')){c.lineWidth=kind==='cel'?3.4:2.2;c.strokeStyle=kind==='cel'?'#1b0f2e':INK;c.lineJoin='round';c.stroke()}};
  S.bgFill=()=>{if(kind==='low'||kind==='vin'){const g=c.createLinearGradient(0,0,0,540);g.addColorStop(0,mulH(pal.field,1.16));g.addColorStop(1,mulH(pal.field,.84));c.fillStyle=g}
    else c.fillStyle=pal.field;c.fillRect(-20,-20,1000,580);
    if(kind==='ink'){c.fillStyle='rgba(60,40,20,.10)';for(let i=0;i<260;i++)c.fillRect(hs(i,1,S.frame)*960,hs(i,2,S.frame)*540,2,2)}};
  S.tuft=(x,y,col,j)=>{if(kind==='low'){c.fillStyle=col;c.beginPath();c.moveTo(x-6,y);c.lineTo(x+6,y);c.lineTo(x,y-15);c.closePath();c.fill()}
    else if(kind==='vin'){c.fillStyle=col;c.beginPath();c.arc(x,y-4,5.5,0,TAU);c.arc(x+5,y-2,4,0,TAU);c.fill()}
    else{c.strokeStyle=kind==='ink'?(j%2?INK:col):col;c.lineWidth=kind==='ink'?1.6:3;c.lineCap='round';c.beginPath();
      c.moveTo(x-5,y);c.quadraticCurveTo(x-7,y-9,x-10,y-13);c.moveTo(x,y);c.quadraticCurveTo(x+1,y-10,x+3,y-16);c.moveTo(x+5,y);c.quadraticCurveTo(x+8,y-8,x+11,y-11);c.stroke()}};
  S.shadow=(u,v,r,a)=>{const[x,y]=prj(u,v,Math.abs(v)<62?0:-SLAB),rx=r*1.35*SC,ry=r*.8*SC;
    if(kind==='low'||kind==='vin'){const g=c.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,'rgba(20,20,40,'+a*(kind==='vin'?1.1:1)+')');g.addColorStop(1,'rgba(20,20,40,0)');c.save();c.scale(1,ry/rx);c.fillStyle=g;c.beginPath();c.arc(x,y*rx/ry,rx,0,TAU);c.fill();c.restore()}
    else if(kind==='cel'){const ga=c.globalAlpha;c.globalAlpha=ga*a;c.fillStyle='#1b0f2e';c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill();c.globalAlpha=ga}
    else{c.save();c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.clip();c.strokeStyle=INK;c.globalAlpha=c.globalAlpha*.6;c.lineWidth=1.4;c.beginPath();for(let i=-rx;i<rx*2;i+=7){c.moveTo(x+i-ry,y+ry);c.lineTo(x+i+ry,y-ry)}c.stroke();c.restore()}};
  return S}

/* ---------- sprites organicos ---------- */
function spr(S,u,v,z,o,draw){const c=S.c,[x,y]=prj(u,v,z);c.save();c.translate(x,y);
  if(o.pitch)c.rotate(o.pitch);
  if(o.head!==undefined){const ca=Math.cos(o.head),sa=Math.sin(o.head);c.transform((ca-sa)*COS*SC,(ca+sa)*SIN*SC,0,SC,0,0)}
  else if(o.skew)c.transform(COS*SC,SIN*SC,0,SC,0,0);else c.scale(SC,SC);
  if(o.sx)c.scale(o.sx,o.sy||o.sx);S.sc=SC*(o.sx||1);draw();c.restore()}
const tube=cy=>[[-15,cy-3],[-11,cy-7],[11,cy-7],[15,cy-3],[15,cy+3],[11,cy+7],[-11,cy+7],[-15,cy+3]];
const BLOB=[[-18,0],[-14,-12],[-2,-18],[12,-14],[20,-2],[10,4],[-8,5]];

function drawMoto(S,s){const lean=Math.max(-1,Math.min(1,s.ang*6)),sw=Math.sin(s.t*TAU*16-1.2)*5,lx=lean*5;
  if(s.nitro>.05){const L=14+s.nitro*34*(.85+.15*Math.sin(s.t*TAU*60));S.shape([[-44,-12],[-44-L,-9],[-44,-6]],'flame');S.shape([[-44,-11],[-44-L*.55,-9],[-44,-7]],'flame2')}
  S.shape([[-46,-12],[-26,-14],[-24,-8],[-46,-6]],'metal');
  S.shape(circ(-30,-13,13),'tire');S.shape(circ(-30,-13,5,8),'hub');
  S.shape([[-22,-10],[-8,-24],[10,-24],[16,-12],[8,-4],[-14,-4]],'metal');
  S.shape([[-40,-24],[-30,-30],[-12,-30],[-6,-24],[-12,-18],[-34,-18]],'moto');
  S.shape([[-6,-6],[8,-16],[26,-18],[38,-8],[34,2],[18,0],[0,0]],'moto');
  S.shape(circ(30,-13,13),'tire');S.shape(circ(30,-13,5,8),'hub');
  S.shape([[-8,-32],[2,-40],[16,-40],[24,-32],[18,-24],[0,-24]],'tank');
  S.shape([[-14+lx,-30],[-8+lx,-52],[2+lx,-60],[12+lx,-56],[10+lx,-40],[2,-30]],'suit');
  S.shape([[-6,-30],[6,-28],[10,-16],[2,-14],[-6,-22]],'suit');
  S.shape([[2,-32],[-12,-34+sw*.3],[-32,-30+sw],[-32,-24+sw],[-12,-26+sw*.3],[2,-26]],'tank');
  S.shape([[6+lx,-52],[22,-40],[26,-36],[22,-34],[4+lx,-44]],'suit');
  S.shape([[22,-38],[30,-42],[32,-40],[24,-35]],'metal');
  S.shape(circ(8+lx,-68,9),'helmet');S.shape([[10+lx,-72],[18+lx,-70],[18+lx,-64],[12+lx,-62]],'visor')}
function drawCrow(S,cr){const c=S.c,f=Math.sin(cr.flap),wy=10+f*9;
  for(const sg of[-1,1])S.shape([[sg*4,-3],[sg*17,-wy],[sg*30,-wy*.3+6],[sg*18,6],[sg*4,5]],'wing');
  S.shape([[-5,-12],[5,-12],[9,-3],[7,9],[0,13],[-7,9],[-9,-3]],'crow');S.shape([[-3,-12],[0,-21],[3,-12]],'beak');
  c.fillStyle=S.kind==='low'?'#d9ff9a':'#fff';c.beginPath();c.arc(-3.5,-6,S.kind==='cel'?3:2,0,TAU);c.arc(3.5,-6,S.kind==='cel'?3:2,0,TAU);c.fill();
  if(S.kind==='cel'){c.fillStyle='#1b0f2e';c.beginPath();c.arc(-3,-6,1.4,0,TAU);c.arc(4,-6,1.4,0,TAU);c.fill()}}

function scene(S,s){const c=S.c,L=[],add=(d,f)=>L.push([d,f]),mx=s.mx,uv=(x,y)=>[x-mx,y-200];
  for(const side of[-1,1])for(let i=0;i<40;i++){const u=wrapU(i,32,s.scroll)+16,v=side*57,a=i%2?'bA':'bB',b=i%2?'bB':'bA';
    add(u+v,()=>spr(S,u,v,0,{skew:1},()=>{S.shape(tube(-6),a);S.shape(tube(-17),b)}))}
  for(let i=0;i<3;i++){const u=wrapU(i,PER/3,s.scroll),v=-150-(i%2)*30;add(u+v,()=>{S.shadow(u,v,22,.3);spr(S,u,v,-SLAB,{},()=>S.shape([[-3,0],[-4,-30],[-16,-58],[-9,-60],[-1,-46],[0,-72],[6,-76],[5,-50],[14,-62],[18,-58],[8,-38],[5,0]],'tree'))})}
  for(let i=0;i<5;i++){const u=wrapU(i,PER/5,s.scroll)+60,v=(i%2?1:-1)*(110+i*9);add(u+v,()=>{S.shadow(u,v,14,.25);spr(S,u,v,-SLAB,{sx:1.1},()=>S.shape(BLOB,'rock'))})}
  {const[u,v]=uv(s.silo.x,s.silo.y);add(u+v,()=>{S.shadow(u,v,28,.35);spr(S,u,v,-SLAB,{},()=>{S.shape([[-28,6],[-28,-56],[-26,-64],[0,-70],[26,-64],[28,-56],[28,6],[0,12]],'silo');
    S.shape([[-28,-56],[-18,-80],[0,-90],[18,-80],[28,-56],[0,-64]],'silo2');S.shape(ell(0,-74,9+Math.sin(s.t*TAU*16)*1.2,5),'acc')})})}
  {const[u,v]=uv(s.cart.x,s.cart.y);add(u+v,()=>{S.shadow(u,v,32,.35);spr(S,u,v,0,{skew:1},()=>{
    S.shape(circ(-20,-9,9),'tire');S.shape(circ(20,-9,9),'tire');S.shape([[-34,-12],[-30,-24],[30,-24],[36,-12],[32,-2],[-32,-2]],'wood');
    S.shape([[-24,-28],[-6,-30],[-4,-48],[-24,-46]],'crate');S.shape([[4,-28],[22,-30],[24,-48],[6,-46]],'crate')})})}
  if(s.barrel.alive){const u=s.barrel.x-mx,v=s.barrel.y-200,p=1+Math.sin(s.t*TAU*12)*.05;add(u+v,()=>{S.shadow(u,v,14,.35);spr(S,u,v,0,{sx:p},()=>{
    S.shape([[-13,-24],[0,-27],[13,-24],[14,-10],[14,8],[13,22],[0,25],[-13,22],[-14,8],[-14,-10]].map(p=>[p[0],p[1]-22]),'barrel');
    S.shape([[-14,-34],[0,-36],[14,-34],[14,-30],[0,-28],[-14,-30]],'metal');S.shape(ell(0,-44,10,5.5),'acc')})})}
  const mvv=s.my-200;
  for(let i=0;i<6;i++){const d=s.dust(i),u=d.x-mx,v=d.y-200;if(d.a>.2)add(u+v-1,()=>{c.globalAlpha=d.a*.8;spr(S,u,v,0,{},()=>S.shape(circ(0,-d.r,d.r*1.2,8),'dash'));c.globalAlpha=1})}
  {const tu=s.trailer.x-mx,tv=s.trailer.y-200,ta=s.trailer.ang,ca=Math.cos(ta),sa=Math.sin(ta);
   add(tu+tv,()=>{S.shadow(tu,tv,28,.35);spr(S,tu,tv,0,{head:ta},()=>{S.shape(circ(-14,-9,9),'tire');S.shape(circ(14,-9,9),'tire');
     S.shape([[-26,-12],[-22,-26],[22,-26],[28,-12],[24,-3],[-24,-3]],'trailer');S.shape([[-20,-26],[20,-26],[16,-20],[-16,-20]],'wood')})});
   const hu=-30*Math.cos(s.ang),hv=mvv-30*Math.sin(s.ang),fu=tu+22*ca,fv=tv+22*sa;
   add(tu+tv+2,()=>{for(let i=0;i<=6;i++){const k=i/6;spr(S,lerp(fu,hu,k),lerp(fv,hv,k),8+Math.sin(k*Math.PI)*-3,{},()=>S.shape(circ(0,0,2.4,6),'metal'))}})}
  {const pu=0,pv=mvv,bob=Math.sin(s.t*TAU*40)*.7;
   add(pu+pv+1,()=>{S.shadow(pu,pv,30,.4);spr(S,pu,pv,bob,{head:s.ang,pitch:-s.nitro*.07,sx:1-.1*s.squash,sy:1+.12*s.squash},()=>drawMoto(S,s))})}
  for(const cr of s.crows){const u=cr.x-mx,v=cr.y-200,z=46+Math.sin(cr.flap)*3-(cr.dead?(1-cr.alpha)*40:0);
    add(u+v+8,()=>{c.globalAlpha=cr.alpha;S.shadow(u,v,9,.3);const[x,y]=prj(u,v,z);c.save();c.translate(x,y);c.rotate(cr.rot);const k=cr.big*SC*.9;c.scale(k,k);S.sc=k;drawCrow(S,cr);c.restore();
      if(cr.dead&&cr.alpha<.95)for(let k2=0;k2<5;k2++){const f=1-cr.alpha,fx=x+Math.cos(k2*1.7)*45*f,fy=y+Math.sin(k2*2.1)*20*f+70*f*f;c.save();c.translate(fx,fy);c.rotate(k2+f*5);S.sc=1.2;c.scale(1.2,1.2);S.shape([[-1.5,0],[0,-6],[1.5,0],[0,5]],'wing');c.restore()}
      c.globalAlpha=1})}
  if(s.boom>=0&&s.boom<.95){const u=s.barrel.x-mx,v=s.barrel.y-200;boom(S,u,v,s)}
  L.sort((a,b)=>a[0]-b[0]);for(const[,f]of L)f()}

function boom(S,u,v,s){const c=S.c,e=s.boom,[x,y]=prj(u,v,12),r=ease(e)*95,al=1-seg(e,.5,.95);
  if(S.kind==='cel'){const k=back(seg(e,0,.35))*(1-seg(e,.5,.95))*70;c.save();c.translate(x,y);c.rotate(e*1.2);
    const star=(r1,r2,fill,st)=>{c.beginPath();for(let i=0;i<20;i++){const a=i*TAU/20,rr=i%2?r2:r1;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fillStyle=fill;c.fill();if(st){c.lineWidth=5;c.strokeStyle='#1b0f2e';c.lineJoin='round';c.stroke()}};
    star(k,k*.62,'#ffd23a',true);star(k*.55,k*.3,'#ff7a1a',false);c.restore();
    if(e<.6){const sc=back(seg(e,0,.25));c.save();c.translate(x,y-80-e*30);c.rotate(-.12);c.scale(sc,sc);c.font='bold 44px Arial Black,sans-serif';c.textAlign='center';c.lineWidth=9;c.strokeStyle='#1b0f2e';c.lineJoin='round';c.strokeText('BOOM',0,0);c.fillStyle='#fff3d6';c.fillText('BOOM',0,0);c.restore()}}
  else if(S.kind==='low'){c.save();c.globalAlpha=al;const g=c.createRadialGradient(x,y,0,x,y,r*1.1);g.addColorStop(0,'rgba(255,255,230,1)');g.addColorStop(.3,'rgba(200,255,90,.9)');g.addColorStop(1,'rgba(200,255,90,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r*1.1,0,TAU);c.fill();
    c.strokeStyle='#c8ff5a';c.lineWidth=4*(1-e);c.beginPath();c.ellipse(x,y+10,ease(e)*150,ease(e)*150*.58,0,0,TAU);c.stroke();
    for(let k=0;k<10;k++){const a=k*TAU/10+.2,d=ease(e)*130*(.6+(k%3)*.25);c.fillStyle='#fff6c8';c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d*.7-e*30,3.2*(1-e)+1,0,TAU);c.fill()}c.restore()}
  else if(S.kind==='ink'){const n=18,P=Array.from({length:n},(_,i)=>{const a=i/n*TAU,rr=(i%2?.55:1)*r*(.85+hs(i,9,S.frame)*.3);return[x+Math.cos(a)*rr,y+Math.sin(a)*rr*.85]});
    c.save();c.globalAlpha=al;trace(c,mv(P,4,4),false);c.fillStyle='#f2c230';c.fill();c.fillStyle='#e0463a';c.beginPath();for(let gx=x-r;gx<x+r;gx+=7)for(let gy=y-r;gy<y+r;gy+=7){const d=Math.hypot(gx-x,gy-y)/r;if(d<.8){c.moveTo(gx+(1-d)*3.2,gy);c.arc(gx,gy,(1-d)*3.2,0,TAU)}}c.fill();
    trace(c,P,false);c.lineWidth=3.2;c.strokeStyle=INK;c.lineJoin='round';c.stroke();
    if(e<.6){c.translate(x,y-r-20);c.rotate(-.1);c.font='bold 40px Arial Black,sans-serif';c.textAlign='center';c.lineWidth=8;c.strokeText('POW!',0,0);c.fillStyle='#fffaf0';c.fillText('POW!',0,0)}c.restore()}
  else{c.save();c.globalAlpha=al;for(let k=0;k<7;k++){const a=k*TAU/7+.4,d=ease(e)*r*.6,cx=x+Math.cos(a)*d,cy=y+Math.sin(a)*d*.8,rr=r*(.38+.12*Math.sin(k*2.3)),g=c.createRadialGradient(cx-rr*.3,cy-rr*.3,0,cx,cy,rr);g.addColorStop(0,'#fff6c8');g.addColorStop(.5,'#ffb347');g.addColorStop(1,'#ff6a4a');c.fillStyle=g;c.beginPath();c.arc(cx,cy,rr,0,TAU);c.fill()}
    c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=5*(1-e);c.beginPath();c.ellipse(x,y+10,ease(e)*150,ease(e)*150*.58,0,0,TAU);c.stroke();c.restore()}}

function ground(S,s){const c=S.c,P=S.pal,wob=(u,b)=>b+Math.sin(TAU*2*(u+s.scroll)/PER)*2.5;
  S.bgFill();
  const tufts=side=>{for(let j=0;j<5;j++){const v=side*(76+28*j);for(let k=0;k<48;k++){const u=wrapU(k,PER/48,s.scroll)+(j%2?13:0),[x,y]=prj(u,v,-SLAB);S.tuft(x,y,j%2?P.tB:P.tA,j)}}};
  tufts(-1);
  const E=v=>{const A=[];for(let u=-700;u<=900;u+=100)A.push(prj(u,wob(u,v),0));return A};
  const top=E(-62),bot=E(62),wallLow=bot.map(p=>[p[0],p[1]+SLAB*SC]);
  S.flat([...bot,...wallLow.slice().reverse()],P.wall,true);
  S.flat([...top,...bot.slice().reverse()],P.road,true);
  const strip=(a,b)=>{const A=[],B=[];for(let u=-700;u<=900;u+=100){A.push(prj(u,wob(u,a),0));B.push(prj(u,wob(u,b),0))}S.flat([...A,...B.reverse()],P.edge,false)};
  strip(-62,-52);strip(52,62);
  for(let i=0;i<20;i++){const u=wrapU(i,64,s.scroll);S.flat([prj(u,-2,0),prj(u+26,-2,0),prj(u+26,2,0),prj(u,2,0)],P.dash,false)}
  tufts(1)}

function hud(S,s){const c=S.c,K=S.kind;c.save();c.textAlign='left';
  const fcol=s.fuel<.3?'#ff4a5a':(K==='ink'?'#6aa83a':'#b6ff3b');
  if(K==='cel'){c.lineWidth=5;c.strokeStyle='#1b0f2e';c.lineJoin='round';c.beginPath();c.roundRect(20,16,250,36,18);c.fillStyle='#1b0f2e';c.fill();c.fillStyle=fcol;c.beginPath();c.roundRect(26,22,238*s.fuel,24,12);c.fill();
    c.beginPath();c.roundRect(690,14,250,46,12);c.fillStyle='#fff3d6';c.fill();c.stroke();c.fillStyle='#1b0f2e';c.font='bold 26px Arial Black,sans-serif';c.save();c.translate(815,48);c.scale(s.pop,s.pop);c.textAlign='center';c.fillText('KILLS '+s.kills+'/50',0,0);c.restore();
    c.beginPath();c.roundRect(848,432,92,92,18);c.fillStyle='#fff3d6';c.fill();c.stroke();c.beginPath();c.arc(894,478,26,0,TAU);c.fillStyle='#4aa3df';c.fill();c.stroke()}
  else if(K==='low'){c.fillStyle='rgba(20,30,40,.55)';c.beginPath();c.roundRect(20,16,250,34,17);c.fill();c.shadowColor=fcol;c.shadowBlur=12;c.fillStyle=fcol;c.beginPath();c.roundRect(26,22,238*s.fuel,22,11);c.fill();c.shadowBlur=0;
    c.fillStyle='rgba(20,30,40,.55)';c.beginPath();c.roundRect(700,16,240,40,12);c.fill();c.fillStyle='#fbf2e0';c.font='600 24px system-ui,sans-serif';c.save();c.translate(714,44);c.scale(s.pop,s.pop);c.fillText('KILLS '+s.kills+'/50',0,0);c.restore();
    c.fillStyle='rgba(20,30,40,.55)';c.beginPath();c.roundRect(852,436,88,88,18);c.fill();c.shadowColor='#c8ff5a';c.shadowBlur=14;c.strokeStyle='#c8ff5a';c.lineWidth=4;c.beginPath();c.arc(896,480,24,0,TAU);c.stroke()}
  else if(K==='ink'){c.lineWidth=3;c.strokeStyle=INK;c.fillStyle='#fffaf0';c.fillRect(20,16,250,36);c.strokeRect(20,16,250,36);c.fillStyle=fcol;c.fillRect(26,22,238*s.fuel,24);
    c.strokeStyle='rgba(43,29,46,.5)';c.lineWidth=1.4;c.beginPath();for(let x=26;x<26+238*s.fuel;x+=7){c.moveTo(x,46);c.lineTo(x+10,22)}c.stroke();c.lineWidth=3;c.strokeStyle=INK;
    c.fillStyle='#fffaf0';c.fillRect(690,14,250,46);c.strokeRect(690,14,250,46);c.fillStyle=INK;c.font='bold 26px Arial Black,sans-serif';c.save();c.translate(704,48);c.scale(s.pop,s.pop);c.fillText('KILLS '+s.kills+'/50',0,0);c.restore();
    c.fillStyle='#fffaf0';c.fillRect(848,432,92,92);c.strokeRect(848,432,92,92);c.beginPath();c.arc(894,478,26,0,TAU);c.stroke()}
  else{const pill=(x,y,w,h,r,col)=>{const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,mixH(col,'#ffffff',.5));g.addColorStop(1,col);c.fillStyle=g;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()};
    pill(20,16,250,36,18,'#4a4066');pill(26,22,238*s.fuel,24,12,s.fuel<.3?'#ff7a8a':'#d4ff6a');
    pill(690,14,250,46,23,'#f5f2ff');c.fillStyle='#4a4066';c.font='bold 26px system-ui,sans-serif';c.save();c.translate(716,48);c.scale(s.pop,s.pop);c.fillText('KILLS '+s.kills+'/50',0,0);c.restore();
    pill(848,432,92,92,30,'#f5f2ff');pill(868,452,52,52,26,'#7a6af0')}
  const[sx0,sy0]=prj(34,-24,14);
  for(let i=0;i<8;i++){const p=ease(seg(s.t,.52+.012*i,.66+.012*i));if(p<=0||p>=1)continue;
    const x=lerp(sx0,150,p)+Math.sin(p*9+i)*14*(1-p),y=lerp(sy0,34,p)-Math.sin(p*Math.PI)*60;
    c.shadowBlur=0;c.fillStyle=K==='ink'?'#6aa83a':'#d4ff6a';c.strokeStyle=K==='cel'?'#1b0f2e':INK;c.lineWidth=2;c.globalAlpha=1;c.beginPath();c.arc(x,y,6-p*2,0,TAU);c.fill();if(K==='cel'||K==='ink')c.stroke()}
  c.restore()}

function post(S,s){const c=S.c,K=S.kind;
  if(K==='cel'){c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=3;c.lineCap='round';
    for(let i=0;i<9;i++){const p=(i*160+s.t*PER*4)%PER,x=(p/PER)*1100-120,y=((i*67)%540),l=60+(i%3)*30;c.beginPath();c.moveTo(x,y);c.lineTo(x+l*COS,y+l*SIN);c.stroke()}}
  if(K==='low'){let g=c.createLinearGradient(0,0,0,540);g.addColorStop(0,'rgba(255,240,220,.22)');g.addColorStop(.4,'rgba(255,240,220,0)');g.addColorStop(1,'rgba(20,30,50,.28)');c.fillStyle=g;c.fillRect(0,0,960,540);
    g=c.createRadialGradient(480,270,260,480,270,640);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,15,30,.45)');c.fillStyle=g;c.fillRect(0,0,960,540)}
  if(K==='vin'){const g=c.createRadialGradient(480,270,300,480,270,650);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(80,60,120,.28)');c.fillStyle=g;c.fillRect(0,0,960,540)}
  if(K==='ink'){c.fillStyle='rgba(60,40,20,.08)';for(let y=0;y<540;y+=6){for(let x=(y/6%2)*3;x<960;x+=6){c.fillRect(x,y,1.4,1.4)}}}}

const styles=['c1','c2','c3','c4'].map((id,i)=>makeStyle(['cel','low','ink','vin'][i],document.getElementById(id).getContext('2d')));
function drawAll(s){for(const S of styles){const c=S.c;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.shadowBlur=0;S.sid=0;S.frame=Math.floor(clock/110);
  c.save();c.translate(s.shx,s.shy);ground(S,s);scene(S,s);c.restore();post(S,s);hud(S,s)}}
function loop(now){
  if(last==null)last=now;if(!paused)clock+=(now-last)*(slow?.25:1);last=now;
  const t=fixedT!=null?fixedT:(clock%DUR)/DUR;drawAll(sim(t));requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
